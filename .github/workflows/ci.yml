name: Standalone generator checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m deta_generator3 init --job-dir tmp/ci-job --samples 4
      - run: python -m deta_generator3 plan --config tmp/ci-job/job.json
      - run: python -m pip wheel --no-deps . --wheel-dir dist
